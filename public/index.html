<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUPTURE Studio</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/client.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#system" aria-label="RUPTURE Studio home">RUPTURE<span>STUDIO</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#system" data-tab="system">01 System</a>
      <a href="#gallery" data-tab="gallery">02 Gallery</a>
      <a href="#generate" data-tab="generate">03 Generate</a>
      <a href="#export" data-tab="export">04 Export</a>
    </nav>
    <div class="status">
      <button type="button" class="btn small primary" id="btn-open-upload" title="Upload artwork references or master artworks">+ Upload Artwork</button>
      <span id="progress" class="mono"></span>
      <span id="mode" class="badge mono"></span>
    </div>
  </header>

  <main>
    <section id="view-system" class="view" hidden></section>
    <section id="view-gallery" class="view" hidden></section>
    <section id="view-generate" class="view" hidden></section>
    <section id="view-export" class="view" hidden></section>
  </main>

  <dialog id="lightbox" aria-label="Artwork preview"></dialog>
  <dialog id="upload-dialog" class="upload-dialog" aria-label="Upload reference artwork"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
